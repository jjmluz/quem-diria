<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#170F2B">
<title>Quem Diria?</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1 class="logo">QUEM DIRIA<span>?</span></h1></header>

<main>
  <section id="join" hidden>
    <form id="join-form" autocomplete="off">
      <label for="name" data-t="yourName"></label>
      <input id="name" name="name" maxlength="14" autocapitalize="words" enterkeyhint="go" required>
      <p class="error" id="join-error" hidden></p>
      <button type="submit" data-t="join"></button>
    </form>
  </section>

  <section id="room" hidden>
    <button class="selfie" id="selfie-button" type="button">
      <span class="avatar big-avatar" id="me-avatar"></span>
      <span class="badge" id="selfie-label" data-t="takeSelfie"></span>
    </button>
    <input id="selfie-input" type="file" accept="image/*" capture="user" hidden>

    <div class="me-name">
      <span id="me-name"></span>
      <button type="button" class="link" id="rename-button" data-t="change"></button>
    </div>
    <form id="rename-form" autocomplete="off" hidden>
      <input id="rename" maxlength="14" autocapitalize="words" enterkeyhint="done" required>
      <button type="submit" data-t="save"></button>
      <p class="error" id="rename-error" hidden></p>
    </form>

    <p class="status" id="status"></p>
    <p class="mode" id="mode"></p>
    <ul class="players" id="players"></ul>
    <div id="keep"></div>

    <button type="button" class="link quiet" id="leave-button" data-t="leave"></button>
  </section>

  <section id="game" hidden></section>
</main>

<!-- Over the game while the TV is paused, so nobody answers into a stopped clock. -->
<div class="paused" id="paused" hidden>
  <p class="paused-title" data-t="paused"></p>
  <p data-t="pausedHint"></p>
</div>

<p class="offline" id="offline" hidden data-t="reconnecting"></p>

<script src="app.js"></script>
<script src="game.js"></script>
</body>
</html>
